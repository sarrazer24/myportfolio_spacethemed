<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-labelledby="llmTitle llmDesc">

  <title id="llmTitle">LLM application architecture flow</title>
  <desc id="llmDesc">Vertical diagram: User → Application Code (white-box testing) → Retrieval / RAG (component testing) → LLM (model evaluation) → Output Processing (software testing) → Answer.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .box   { fill:#f1f5f9; stroke:#334155; stroke-width:1.5; }
    .lbl   { fill:#0f172a; font-size:15px; text-anchor:middle; dominant-baseline:middle; }
    .note  { fill:#64748b; font-size:12px; dominant-baseline:middle; }
    .title { fill:#0f172a; font-size:18px; font-weight:700; text-anchor:middle; }
    .user  { fill:#0f172a; font-size:15px; text-anchor:middle; }
    .edge  { stroke:#475569; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .dash  { stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:4 3; fill:none; marker-end:url(#arrow); }
  </style>

  <text class="title" x="240" y="30">LLM APPLICATION</text>

  <text class="user" x="240" y="70">User</text>
  <line class="edge" x1="240" y1="82" x2="240" y2="104"/>

  <rect class="box" x="140" y="110" width="200" height="40" rx="6"/>
  <text class="lbl" x="240" y="131">Application Code</text>
  <line class="dash" x1="345" y1="130" x2="392" y2="130"/>
  <text class="note" x="398" y="130">White-box testing</text>

  <line class="edge" x1="240" y1="150" x2="240" y2="174"/>

  <rect class="box" x="140" y="180" width="200" height="40" rx="6"/>
  <text class="lbl" x="240" y="201">Retrieval / RAG</text>
  <line class="dash" x1="345" y1="200" x2="392" y2="200"/>
  <text class="note" x="398" y="200">Component testing</text>

  <line class="edge" x1="240" y1="220" x2="240" y2="244"/>

  <rect class="box" x="140" y="250" width="200" height="40" rx="6"/>
  <text class="lbl" x="240" y="271">LLM</text>
  <line class="dash" x1="345" y1="270" x2="392" y2="270"/>
  <text class="note" x="398" y="270">Model evaluation</text>

  <line class="edge" x1="240" y1="290" x2="240" y2="314"/>

  <rect class="box" x="140" y="320" width="200" height="40" rx="6"/>
  <text class="lbl" x="240" y="341">Output Processing</text>
  <line class="dash" x1="345" y1="340" x2="392" y2="340"/>
  <text class="note" x="398" y="340">Software testing</text>

  <line class="edge" x1="240" y1="360" x2="240" y2="384"/>

  <text class="lbl" x="240" y="402" font-size="15" font-weight="600">Answer</text>
</svg>